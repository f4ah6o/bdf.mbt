name: moonbit
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm-gc]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: moon version --all
      - run: moon check --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }}

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: npm ci
      - run: node site/verify-samples.mjs
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      # The gallery thumbnails are checked in: fail when they no longer match
      # what the built demo renders for the card's sample.
      - run: npm run test:previews

