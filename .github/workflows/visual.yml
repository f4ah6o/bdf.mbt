name: Visual compatibility
on:
  # A branch push and its pull_request both fire, so every PR ran twice.
  # Restrict push to main: PRs (same repo and forks) are covered by
  # pull_request, and main is covered by push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: hustcer/setup-moonbit@v1
      - run: moon update
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test XLSX picture browser rendering
        run: |
          moon build --target js
          node compat/xlsx/picture-visual-compare.mjs
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: _build/visual-diff/
          if-no-files-found: ignore
