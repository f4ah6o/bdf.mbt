name: Visual compatibility
# Local verification definition. GitHub never runs this workflow: the push
# trigger ignores every branch and there is no manual trigger. `npm run
# verify:local` runs it through actrun, which ignores branch filters.
#
# Keep the file in .github/workflows: actrun uses the workflow's directory as
# the workspace, and only .github/workflows resolves to the repository root.
on:
  push:
    branches-ignore: ['**']
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v4
        if: ${{ !env.ACTRUN_LOCAL }}
      - name: setup Node.js
        uses: actions/setup-node@v4
        if: ${{ !env.ACTRUN_LOCAL }}
        with:
          node-version: '24'
          cache: npm
      - name: setup MoonBit
        uses: hustcer/setup-moonbit@v1
        if: ${{ !env.ACTRUN_LOCAL }}
      - name: moon update
        if: ${{ !env.ACTRUN_LOCAL }}
        run: moon update
      - name: npm ci
        if: ${{ !env.ACTRUN_LOCAL }}
        run: npm ci
      - name: install Playwright Chromium
        if: ${{ !env.ACTRUN_LOCAL }}
        run: npx playwright install --with-deps chromium
      - name: test XLSX picture rendering
        run: |
          node compat/retained-test.mjs --mode build js
          node compat/xlsx/picture-visual-compare.mjs
      # The aggregate excludes dropped-format suites. Their source files and
      # individual scripts remain available as dormant assets.
      - name: test visual compatibility
        run: npm run test:visual
      - name: upload visual diff
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: _build/visual-diff/
          if-no-files-found: ignore
