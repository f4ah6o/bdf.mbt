name: Visual compatibility
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: hustcer/setup-moonbit@v1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
