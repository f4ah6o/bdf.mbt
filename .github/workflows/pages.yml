name: Site pages
# Local verification definition. GitHub never runs this workflow: the push
# trigger ignores every branch and there is no manual trigger. `npm run
# verify:local` runs the build job through actrun, which ignores branch filters.
#
# Keep the file in .github/workflows: actrun uses the workflow's directory as
# the workspace, and only .github/workflows resolves to the repository root.
#
# This workflow only builds and checks the site. It has no deployment job and
# never uploads a Pages artifact; deployment is the separate manual workflow in
# pages-deploy.yml.
on:
  push:
    branches-ignore: ['**']

permissions:
  contents: read

concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4
        if: ${{ !env.ACTRUN_LOCAL }}
      - name: setup Node.js
        uses: actions/setup-node@v4
        if: ${{ !env.ACTRUN_LOCAL }}
        with:
          node-version: '24'
          cache: npm
      - name: setup MoonBit
        uses: hustcer/setup-moonbit@v1
        if: ${{ !env.ACTRUN_LOCAL }}
      - name: moon update
        if: ${{ !env.ACTRUN_LOCAL }}
        run: moon update
      - name: npm ci
        if: ${{ !env.ACTRUN_LOCAL }}
        run: npm ci
      - name: install Playwright Chromium
        if: ${{ !env.ACTRUN_LOCAL }}
        run: npx playwright install --with-deps chromium
      - name: Build the site (bdf.mbt in JavaScript and wasm-gc)
        id: build_site
        run: npm run build:site
      - name: Test the site
        id: site_test
        run: npm run test:site
      - name: Check the gallery previews and the sample checksums
        id: preview_test
        run: npm run test:previews
      - name: Check the committed benchmarks still hold
        id: bench_check
        run: npm run bench:site -- --check
      - name: Validate the site with vlmkit
        id: ui_gates
        run: |
          set -euo pipefail
          set -x
          # Bind an ephemeral port. A fixed port can already be taken by an
          # unrelated server, and the checks would then measure that site
          # instead of _build/pages.
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          server_log=$(mktemp)
          python3 -m http.server --directory _build/pages "$port" --bind 127.0.0.1 >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -f "$server_log"
          }
          trap cleanup EXIT
          url=http://127.0.0.1:$port
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS "$url/" >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ] || ! kill -0 "$server_pid" 2>/dev/null; then
            echo "the local site server did not come up on port $port" >&2
            cat "$server_log" >&2
            exit 1
          fi
          node .github/probe-overflow.mjs "$url/"
          ./node_modules/.bin/vlmkit check integrity "$url" --no-ledger --allow "invisible-text@#demo;text-layer spans are transparent by design (selection overlay)"
          ./node_modules/.bin/vlmkit check copy "$url" --manifest site/copy.txt --no-ledger
          ./node_modules/.bin/vlmkit scan scroll "$url" --no-ledger
          ./node_modules/.bin/vlmkit scan handlers "$url" --no-ledger
          ./node_modules/.bin/vlmkit check interactions "$url" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url" --sweep --no-ledger
          ./node_modules/.bin/vlmkit check integrity "$url/viewer/" --no-ledger --allow "invisible-text@#preview;text-layer spans are transparent by design (selection overlay)"
          ./node_modules/.bin/vlmkit scan scroll "$url/viewer/" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url/viewer/" --sweep --no-ledger
          ./node_modules/.bin/vlmkit check integrity "$url/docs/index.html" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url/docs/index.html" --sweep --no-ledger
          ./node_modules/.bin/vlmkit check integrity "$url/thumbnail/" --no-ledger
          ./node_modules/.bin/vlmkit scan scroll "$url/thumbnail/" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url/thumbnail/" --sweep --no-ledger
          ./node_modules/.bin/vlmkit check integrity "$url/text/" --no-ledger
          ./node_modules/.bin/vlmkit scan scroll "$url/text/" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url/text/" --sweep --no-ledger
          ./node_modules/.bin/vlmkit check integrity "$url/form/" --no-ledger
          ./node_modules/.bin/vlmkit scan scroll "$url/form/" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url/form/" --sweep --no-ledger
          ./node_modules/.bin/vlmkit check integrity "$url/wasm-gc.html" --no-ledger --allow "invisible-text@#preview;text-layer spans are transparent by design (selection overlay)"
          ./node_modules/.bin/vlmkit scan scroll "$url/wasm-gc.html" --no-ledger
          ./node_modules/.bin/vlmkit check breakpoints "$url/wasm-gc.html" --sweep --no-ledger
          # A server that died mid-run would leave the checks talking to
          # whatever else answers on the port, so fail instead of trusting them.
          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo "the local site server exited before the checks finished; the results above may describe another server" >&2
            cat "$server_log" >&2
            exit 1
          fi
