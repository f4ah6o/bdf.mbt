name: turtles-mutate-local
# Local-only, explicitly invoked mutation run. Separate from the default verify
# workflow so a normal verification pass never spends minutes on mutants.
# Invoking this file IS the opt-in.
#
#   node <actrun> workflow run .github/local/turtles-mutate.yml
on:
  push:
    branches-ignore: ['**']
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ../..
    steps:
      - name: ratchet
        run: moon run scripts/turtles-ratchet.mbtx
